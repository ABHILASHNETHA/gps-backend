<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS Tracker Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root{--ink:#1d2433;--muted:#6b7385;--line:#dde1ea;--bg:#f5f6f9;--card:#fff;--route:#3b3fd8;--start:#1f9d55;--end:#d6402f}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
  header h1{font-size:20px;margin:0 18px 2px 0;font-weight:700}
  label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px}
  input,select,button{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
  input,select{min-width:210px}
  button{background:var(--route);color:#fff;border-color:var(--route);cursor:pointer;font-weight:600}
  button:hover{filter:brightness(1.1)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--route);outline-offset:2px}
  button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  main{flex:1;display:grid;grid-template-columns:360px 1fr;min-height:0}
  aside{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
  .stats div{padding:12px;border-right:1px solid var(--line)}
  .stats div:last-child{border-right:0}
  .stats b{display:block;font-size:18px}
  .stats span{font-size:12px;color:var(--muted)}
  #msg{padding:10px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
  #msg.err{color:var(--end)}
  #list{overflow:auto;flex:1;margin:0;padding:0;list-style:none}
  #list li{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  #list li:hover,#list li.on{background:#eef0ff}
  #list .t{font-weight:600;font-size:14px}
  #list .p{font-size:13px;color:var(--ink);margin-top:2px}
  #list .c{font-size:11px;color:var(--muted);margin-top:2px}
  #map{min-height:300px}
  .dot{width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
  @media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:55vh 1fr}#map{order:-1}aside{border-right:0}input{min-width:150px}}
</style>
</head>
<body>
<header>
  <h1>GPS Tracker</h1>
  <label>Device
    <select id="device"></select>
  </label>
  <button id="add" class="ghost">Add device</button>
  <label>Date (IST)
    <input id="date" type="date">
  </label>
  <button id="go">Show path</button>
  <button id="today" class="ghost">Today</button>
</header>

<main>
  <aside>
    <div class="stats">
      <div><b id="sCount">0</b><span>Points</span></div>
      <div><b id="sDist">0 km</b><span>Distance</span></div>
      <div><b id="sSpan">--</b><span>Time span</span></div>
    </div>
    <div id="msg">Choose a device and a date, then click Show path.</div>
    <ul id="list"></ul>
  </aside>
  <div id="map"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const map = L.map('map').setView([17.385, 78.4867], 11);
const carto = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  subdomains:'abcd', maxZoom:20,
  attribution:'&copy; OpenStreetMap contributors &copy; CARTO'
});
const esriStreet = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom:19, attribution:'Tiles &copy; Esri'
});
const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom:19, attribution:'Tiles &copy; Esri'
});
carto.addTo(map);
L.control.layers({'Street (CARTO)':carto, 'Street (Esri)':esriStreet, 'Satellite (Esri)':esriSat}).addTo(map);
let layer = L.layerGroup().addTo(map);
let runId = 0;

const istFmt = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Kolkata', year:'numeric', month:'2-digit', day:'2-digit'});
const istTime = new Intl.DateTimeFormat('en-IN', {timeZone:'Asia/Kolkata', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true});
const istDate = ts => istFmt.format(new Date(ts));            // YYYY-MM-DD in IST
const shiftDay = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0,10); };

function setMsg(t, err){ $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }

// Fixed backend address
const API = 'https://gps-backend-uf7a.onrender.com';
// Optional: pre-fill the dropdown, e.g. ['Realme RMX3085', 'Samsung SM-A546E']
const PRESET_DEVICES = [];

const getDevices = () => [...new Set([...PRESET_DEVICES, ...JSON.parse(localStorage.getItem('gps_devices') || '[]')])];
function renderDevices(pick){
  const names = getDevices(), sel = $('device');
  sel.innerHTML = '';
  if(!names.length){ sel.innerHTML = '<option value="">No devices yet - click Add device</option>'; return; }
  names.forEach(n => { const o = document.createElement('option'); o.value = o.textContent = n; sel.appendChild(o); });
  const want = pick || localStorage.getItem('gps_last_device');
  sel.value = names.includes(want) ? want : names[0];
}
function addDevice(n){
  const names = JSON.parse(localStorage.getItem('gps_devices') || '[]');
  if(!names.includes(n)) names.unshift(n);
  localStorage.setItem('gps_devices', JSON.stringify(names));
  renderDevices(n);
}
// If the server ever offers GET /api/locations/devices, the list fills itself. Otherwise this is skipped.
async function fetchRemoteDevices(){
  try{
    const r = await fetch(API + '/api/locations/devices');
    if(!r.ok) return;
    const arr = await r.json();
    arr.map(x => typeof x === 'string' ? x : x.device_id).filter(Boolean).forEach(addDevice);
  }catch(e){}
}

// Fetch logs. An IST day covers two UTC dates, so we ask for the previous day too
// and keep only rows whose IST date matches. Works with either backend version.
async function fetchDay(api, device, date){
  const out = [];
  for (const d of [shiftDay(date, -1), date]) {
    const url = `${api}/api/locations/logs?deviceId=${encodeURIComponent(device)}&date=${d}`;
    const r = await fetch(url);
    if(!r.ok) throw new Error('Server returned ' + r.status);
    out.push(...await r.json());
  }
  const seen = new Set();
  return out
    .map(r => ({id:r.id, lat:+r.latitude, lng:+r.longitude, ts:new Date(r.recorded_at).getTime()}))
    .filter(p => !isNaN(p.lat) && !isNaN(p.lng) && istDate(p.ts) === date)
    .filter(p => !seen.has(p.id) && seen.add(p.id))
    .sort((a,b) => a.ts - b.ts);
}

const km = (a,b) => {
  const R = 6371, rad = x => x*Math.PI/180;
  const dLat = rad(b.lat-a.lat), dLng = rad(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
};

// Reverse geocoding (OpenStreetMap Nominatim, max 1 request/second), cached in the browser
const geoCache = JSON.parse(localStorage.getItem('gps_geo') || '{}');
const key = p => p.lat.toFixed(4) + ',' + p.lng.toFixed(4);
async function placeName(p){
  const k = key(p);
  if(geoCache[k]) return geoCache[k];
  const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat=${p.lat}&lon=${p.lng}`);
  if(!r.ok) throw new Error('geocode ' + r.status);
  const j = await r.json();
  geoCache[k] = j.display_name || 'Unknown place';
  localStorage.setItem('gps_geo', JSON.stringify(geoCache));
  return geoCache[k];
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function icon(color){ return L.divIcon({className:'', html:`<div class="dot" style="background:${color}"></div>`, iconSize:[16,16], iconAnchor:[8,8]}); }

async function load(){
  const api = API;
  const device = $('device').value.trim();
  const date = $('date').value;
  if(!api || !device || !date){ setMsg('Choose a device and a date first.', true); return; }

  const id = ++runId;
  layer.clearLayers(); $('list').innerHTML = '';
  ['sCount','sDist','sSpan'].forEach((x,i) => $(x).textContent = ['0','0 km','--'][i]);
  setMsg('Loading… the first request can take up to a minute if the server was asleep.');
  $('go').disabled = true;

  try{
    const pts = await fetchDay(api, device, date);
    if(id !== runId) return;
    localStorage.setItem('gps_last_device', device);
    if(!pts.length){ setMsg('No locations recorded for this device on ' + date + ' (IST).'); return; }

    let dist = 0;
    for(let i=1;i<pts.length;i++) dist += km(pts[i-1], pts[i]);
    $('sCount').textContent = pts.length;
    $('sDist').textContent = dist.toFixed(1) + ' km';
    $('sSpan').textContent = istTime.format(pts[0].ts).replace(/:\d\d /,' ') + ' – ' + istTime.format(pts[pts.length-1].ts).replace(/:\d\d /,' ');

    // path
    const latlngs = pts.map(p => [p.lat, p.lng]);
    L.polyline(latlngs, {color:'#3b3fd8', weight:4, opacity:.85}).addTo(layer);
    pts.forEach((p,i) => {
      const first = i===0, last = i===pts.length-1;
      const m = (first||last)
        ? L.marker(latlngs[i], {icon: icon(first ? '#1f9d55' : '#d6402f')})
        : L.circleMarker(latlngs[i], {radius:5, color:'#fff', weight:2, fillColor:'#3b3fd8', fillOpacity:1});
      m.addTo(layer);
      p.marker = m;
      m.bindPopup(() => `<b>${istTime.format(p.ts)}</b><br>${p.name || 'Locating…'}`);
    });
    map.fitBounds(latlngs, {padding:[40,40], maxZoom:17});

    // list
    const ul = $('list');
    pts.forEach((p,i) => {
      const li = document.createElement('li');
      li.innerHTML = `<div class="t">${istTime.format(p.ts)}${i===0?' (start)':''}${i===pts.length-1&&i>0?' (latest)':''}</div>
        <div class="p">Finding place name…</div>
        <div class="c">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</div>`;
      li.onclick = () => {
        [...ul.children].forEach(x => x.classList.remove('on'));
        li.classList.add('on');
        map.setView([p.lat,p.lng], Math.max(map.getZoom(), 16));
        p.marker.openPopup();
      };
      p.li = li; ul.appendChild(li);
    });
    setMsg(pts.length + ' points on ' + date + ' (IST). Click a point to see it on the map.');

    // place names, one at a time to respect the geocoder limit
    for(const p of pts){
      if(id !== runId) return;
      const cached = !!geoCache[key(p)];
      try{ p.name = await placeName(p); }catch(e){ p.name = 'Place name unavailable'; }
      p.li.querySelector('.p').textContent = p.name;
      if(!cached) await sleep(1100);
    }
  }catch(e){
    setMsg('Could not load data: ' + e.message, true);
  }finally{
    $('go').disabled = false;
  }
}

$('go').onclick = load;
$('today').onclick = () => { $('date').value = istDate(Date.now()); load(); };
$('add').onclick = () => {
  const n = (prompt('Enter the device name or number exactly as shown in the app:') || '').trim();
  if(n) addDevice(n);
};
$('date').addEventListener('keydown', e => e.key==='Enter' && load());
renderDevices();
fetchRemoteDevices();
$('date').value = istDate(Date.now());
</script>
</body>
</html>
