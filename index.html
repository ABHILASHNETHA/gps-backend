<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Phone GPS Tracker Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #f8fafc; }
    
    /* Header */
    header { background: #0f172a; color: #fff; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    
    /* Status Badge */
    #statusBadge { display: flex; align-items: center; gap: 0.5rem; background: #1e293b; padding: 0.375rem 0.75rem; border-radius: 9999px; font-size: 0.8125rem; border: 1px solid #334155; }
    #statusDot { width: 8px; height: 8px; background-color: #94a3b8; border-radius: 50%; display: inline-block; }
    #statusText { color: #cbd5e1; }

    /* Controls Bar */
    .controls { display: flex; gap: 0.75rem; align-items: center; background: #ffffff; padding: 0.875rem 1.5rem; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
    input[type="date"], button { padding: 0.5rem 0.75rem; border-radius: 0.375rem; border: 1px solid #cbd5e1; font-size: 0.875rem; }
    button { background: #2563eb; color: white; border: none; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #stats { margin-left: auto; font-size: 0.875rem; color: #475569; font-weight: 500; }

    /* Playback Bar */
    .playback-controls { display: flex; gap: 1rem; align-items: center; background: #f1f5f9; padding: 0.625rem 1.5rem; border-bottom: 1px solid #e2e8f0; font-size: 0.875rem; }

    /* Main Split Layout */
    .main-container { display: flex; flex-grow: 1; height: calc(100vh - 180px); overflow: hidden; }
    #map { flex: 2; height: 100%; }
    
    /* Logs Panel Side */
    .logs-panel { flex: 1; background: #ffffff; border-left: 1px solid #e2e8f0; display: flex; flex-direction: column; overflow: hidden; }
    .logs-header { padding: 0.75rem 1rem; background: #f8fafc; font-weight: 600; font-size: 0.875rem; border-bottom: 1px solid #e2e8f0; color: #334155; }
    .table-container { overflow-y: auto; flex-grow: 1; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.8125rem; }
    th, td { padding: 0.625rem 0.75rem; border-bottom: 1px solid #f1f5f9; }
    th { background: #f8fafc; position: sticky; top: 0; color: #64748b; font-weight: 600; }
    tr:hover { background: #f8fafc; }
    .time-col { white-space: nowrap; color: #0f172a; font-weight: 500; }
    .coord-col { color: #64748b; font-family: monospace; }
  </style>
</head>
<body>

  <header>
    <h1>Personal Phone GPS Tracker</h1>
    <div id="statusBadge">
      <span id="statusDot"></span>
      <span id="statusText">Checking status...</span>
    </div>
  </header>

  <!-- Controls Bar -->
  <div class="controls">
    <label for="datePicker">Select Date:</label>
    <input type="date" id="datePicker">
    <button onclick="loadReport()">Load Report</button>
    <button onclick="exportToCSV()" style="background: #16a34a;" id="exportBtn" disabled>Export CSV</button>
    
    <div style="display: flex; align-items: center; gap: 0.5rem; margin-left: 1rem; font-size: 0.875rem;">
      <input type="checkbox" id="autoRefreshToggle" onchange="toggleAutoRefresh()" style="width: 16px; height: 16px; cursor: pointer;">
      <label for="autoRefreshToggle" style="cursor: pointer;">Auto-refresh (5m)</label>
      <span id="refreshStatus" style="color: #64748b; font-size: 0.75rem;">(Off)</span>
    </div>

    <div id="stats">Total Logs: 0 | Distance: 0.00 km</div>
  </div>

  <!-- Playback Replay Bar -->
  <div class="playback-controls">
    <button onclick="togglePlayback()" id="playBtn" style="background: #0f172a;" disabled>Play Replay</button>
    <label for="timeSlider" style="font-weight: 500; color: #334155;">Replay Progress:</label>
    <input type="range" id="timeSlider" min="0" max="100" value="0" disabled style="flex-grow: 1; cursor: pointer;" oninput="onSliderChange(this.value)">
    <span id="replayTimeDisplay" style="font-family: monospace; font-weight: 600; color: #2563eb; min-width: 80px;">--:--:--</span>
  </div>

  <!-- Main View Container -->
  <div class="main-container">
    <div id="map"></div>

    <div class="logs-panel">
      <div class="logs-header">5-Minute Interval Logs</div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Time (UTC)</th>
              <th>Latitude</th>
              <th>Longitude</th>
            </tr>
          </thead>
          <tbody id="logsTableBody">
            <tr>
              <td colspan="3" style="text-align: center; color: #94a3b8; padding: 2rem;">Select a date and click load.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const BACKEND_URL = "https://gps-backend-uf7a.onrender.com";
    const DEVICE_ID = "MY_PHONE";

    let currentLogsData = [];
    let autoRefreshTimer = null;
    let playbackInterval = null;
    let isPlaying = false;
    let playbackMarker = null;

    // Default input to today's date
    document.getElementById('datePicker').value = new Date().toISOString().split('T')[0];

    // Initialize Leaflet Map
    const map = L.map('map').setView([17.3850, 78.4867], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    let layerGroup = L.layerGroup().addTo(map);

    // Haversine Distance Formula
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function getTotalPathDistance(points) {
      let totalKm = 0;
      for (let i = 0; i < points.length - 1; i++) {
        totalKm += calculateDistance(points[i].latitude, points[i].longitude, points[i+1].latitude, points[i+1].longitude);
      }
      return totalKm.toFixed(2);
    }

    // Status Badge Checker
    async function checkDeviceStatus() {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      try {
        const today = new Date().toISOString().split('T')[0];
        const res = await fetch(`${BACKEND_URL}/api/locations/logs?deviceId=${DEVICE_ID}&date=${today}`);
        const data = await res.json();
        if (!data || data.length === 0) {
          statusDot.style.background = "#eab308";
          statusText.innerText = "No data today";
          return;
        }
        const diffMinutes = Math.floor((new Date() - new Date(data[0].recorded_at)) / (1000 * 60));
        if (diffMinutes <= 10) {
          statusDot.style.background = "#22c55e";
          statusText.innerText = `Online (${diffMinutes <= 0 ? 'just now' : diffMinutes + 'm ago'})`;
        } else if (diffMinutes < 120) {
          statusDot.style.background = "#eab308";
          statusText.innerText = `Delayed (${diffMinutes}m ago)`;
        } else {
          statusDot.style.background = "#ef4444";
          statusText.innerText = `Offline (${Math.floor(diffMinutes / 60)}h ago)`;
        }
      } catch (err) {
        statusDot.style.background = "#ef4444";
        statusText.innerText = "Connection error";
      }
    }

    // Load Logs Report
    async function loadReport(isBackgroundRefresh = false) {
      const selectedDate = document.getElementById('datePicker').value;
      if (!selectedDate) {
        if (!isBackgroundRefresh) alert("Please select a date.");
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/api/locations/logs?deviceId=${DEVICE_ID}&date=${selectedDate}`);
        const data = await res.json();
        currentLogsData = data;
        const exportBtn = document.getElementById('exportBtn');

        layerGroup.clearLayers();
        const tbody = document.getElementById('logsTableBody');
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
          document.getElementById('stats').innerText = "Total Logs: 0 | Distance: 0.00 km";
          exportBtn.disabled = true;
          tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #94a3b8; padding: 2rem;">No logs found.</td></tr>`;
          initPlayback([]);
          return;
        }

        const totalDistance = getTotalPathDistance(data);
        document.getElementById('stats').innerText = `Total Logs: ${data.length} points | Distance: ${totalDistance} km`;
        exportBtn.disabled = false;

        const chronologicalData = [...data].reverse();
        const coordinates = chronologicalData.map(pt => [pt.latitude, pt.longitude]);

        const polyline = L.polyline(coordinates, { color: '#2563eb', weight: 4, opacity: 0.8 }).addTo(layerGroup);
        if (!isBackgroundRefresh) map.fitBounds(polyline.getBounds());

        initPlayback(chronologicalData);

        data.forEach((pt) => {
          const recordedTime = new Date(pt.recorded_at);
          const timeString = recordedTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

          const marker = L.circleMarker([pt.latitude, pt.longitude], {
            radius: 5, color: '#2563eb', fillColor: '#ffffff', fillOpacity: 1, weight: 2
          }).addTo(layerGroup);

          marker.bindPopup(`<b>Time:</b> ${timeString}<br><b>Lat:</b> ${pt.latitude}<br><b>Lng:</b> ${pt.longitude}`);

          const row = document.createElement('tr');
          row.innerHTML = `<td class="time-col">${recordedTime.toLocaleString()}</td><td class="coord-col">${pt.latitude.toFixed(5)}</td><td class="coord-col">${pt.longitude.toFixed(5)}</td>`;
          tbody.appendChild(row);
        });

        checkDeviceStatus();
      } catch (err) {
        console.error(err);
        if (!isBackgroundRefresh) alert("Failed to fetch logs. Check your backend URL.");
      }
    }

    // CSV Export
    function exportToCSV() {
      if (!currentLogsData || currentLogsData.length === 0) return alert("No data to export.");
      let csv = "data:text/csv;charset=utf-8,ID,Timestamp (UTC),Latitude,Longitude\n";
      currentLogsData.forEach(pt => { csv += `${pt.id},"${pt.recorded_at}",${pt.latitude},${pt.longitude}\n`; });
      const link = document.createElement("a");
      link.setAttribute("href", encodeURI(csv));
      link.setAttribute("download", `gps_logs_${document.getElementById('datePicker').value}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Auto-refresh Timer Toggle
    function toggleAutoRefresh() {
      const isChecked = document.getElementById('autoRefreshToggle').checked;
      const statusSpan = document.getElementById('refreshStatus');
      if (isChecked) {
        statusSpan.style.color = "#16a34a";
        statusSpan.innerText = "(Active)";
        autoRefreshTimer = setInterval(() => {
          const selectedDate = document.getElementById('datePicker').value;
          if (selectedDate === new Date().toISOString().split('T')[0]) loadReport(true);
        }, 300000);
      } else {
        statusSpan.style.color = "#64748b";
        statusSpan.innerText = "(Off)";
        if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      }
    }

    // Playback Replay Logic
    function initPlayback(chronologicalData) {
      const playBtn = document.getElementById('playBtn');
      const slider = document.getElementById('timeSlider');
      if (!chronologicalData || chronologicalData.length === 0) {
        playBtn.disabled = true;
        slider.disabled = true;
        return;
      }
      playBtn.disabled = false;
      slider.disabled = false;
      slider.min = 0;
      slider.max = chronologicalData.length - 1;
      slider.value = 0;
      if (playbackMarker) map.removeLayer(playbackMarker);
      playbackMarker = L.marker([chronologicalData[0].latitude, chronologicalData[0].longitude]).addTo(map);
      updatePlaybackFrame(0);
    }

    function togglePlayback() {
      const playBtn = document.getElementById('playBtn');
      const chronologicalData = [...currentLogsData].reverse();
      if (isPlaying) {
        clearInterval(playbackInterval);
        isPlaying = false;
        playBtn.innerText = "Play Replay";
        playBtn.style.background = "#0f172a";
      } else {
        if (document.getElementById('timeSlider').value >= chronologicalData.length - 1) document.getElementById('timeSlider').value = 0;
        isPlaying = true;
        playBtn.innerText = "Pause";
        playBtn.style.background = "#dc2626";
        playbackInterval = setInterval(() => {
          const slider = document.getElementById('timeSlider');
          let idx = parseInt(slider.value);
          if (idx < chronologicalData.length - 1) {
            slider.value = ++idx;
            updatePlaybackFrame(idx);
          } else {
            togglePlayback();
          }
        }, 600);
      }
    }

    function onSliderChange(idx) {
      if (isPlaying) togglePlayback();
      updatePlaybackFrame(parseInt(idx));
    }

    function updatePlaybackFrame(idx) {
      const chronologicalData = [...currentLogsData].reverse();
      if (!chronologicalData[idx]) return;
      const pt = chronologicalData[idx];
      const latLng = [pt.latitude, pt.longitude];
      if (playbackMarker) playbackMarker.setLatLng(latLng);
      document.getElementById('replayTimeDisplay').innerText = new Date(pt.recorded_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      map.panTo(latLng, { animate: true, duration: 0.3 });
    }

    // Initial load call on startup
    checkDeviceStatus();
    loadReport();
  </script>
</body>
</html>
